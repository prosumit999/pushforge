<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PushForge Web Push SDK Live Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      max-width: 520px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .logo-badge {
      width: 54px;
      height: 54px;
      background: #2563eb;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.5rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 14px rgba(37,99,235,0.4);
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    button {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 0.875rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(37,99,235,0.35);
    }
    button:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      transform: translateY(-1px);
    }
    .key-info {
      margin-top: 1.25rem;
      padding: 0.5rem 0.75rem;
      background: #0f172a;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.8rem;
      color: #38bdf8;
      word-break: break-all;
    }
    .status {
      margin-top: 1.25rem;
      padding: 0.875rem;
      border-radius: 8px;
      background: #334155;
      font-family: monospace;
      font-size: 0.85rem;
      word-break: break-all;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">P</div>
    <h1>PushForge Client SDK Live Test</h1>
    <p>Test live Push Notification subscriptions and events for your PushForge site key.</p>

    <button id="subscribeBtn">🔔 Subscribe to Notifications</button>

    <div className="key-info" id="keyDisplay">Site Key: Loading...</div>
    <div className="status" id="statusLog">Status: Initializing PushForge SDK...</div>
  </div>

  <script>
    (function() {
      var urlParams = new URLSearchParams(window.location.search);
      var activeKey = urlParams.get('siteKey') || 'pf_live_demo_key_123456789';

      document.getElementById("keyDisplay").textContent = "Active Site Key: " + activeKey;

      // Dynamically load SDK script with active siteKey
      var script = document.createElement("script");
      script.src = "/sdk.js";
      script.setAttribute("data-site-key", activeKey);
      document.head.appendChild(script);

      document.getElementById("subscribeBtn").addEventListener("click", function() {
        var log = document.getElementById("statusLog");
        log.textContent = "Status: Requesting Web Push Permission...";

        if (window.PushForge && window.PushForge.requestPermissionAndSubscribe) {
          window.PushForge.requestPermissionAndSubscribe()
            .then(function(res) {
              log.style.backgroundColor = "#166534";
              log.textContent = "✓ Successfully Subscribed! ID: " + (res.subscriberId || "Success");
            })
            .catch(function(err) {
              log.style.backgroundColor = "#991b1b";
              log.textContent = "Status Error: " + (err.message || err);
            });
        } else {
          log.textContent = "Status Error: SDK initializing... Please try again in 1 second.";
        }
      });
    })();
  </script>
</body>
</html>
